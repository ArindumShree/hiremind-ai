services:
  db:
    image: postgres:17-alpine
    container_name: hiremind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiremind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiremind}
      POSTGRES_DB: ${POSTGRES_DB:-hiremind_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiremind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiremind-backend
    restart: unless-stopped
    # All secrets/config come from backend/.env (copy docker/docker-compose.env.example).
    # Required secrets the operator MUST set: SECRET_KEY, POSTGRES_PASSWORD,
    # GEMINI_API_KEY (only needed for AI question generation; service degrades
    # gracefully if empty). See docker/docker-compose.env.example.
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hiremind-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
